[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 921600
upload_protocol = esptool

; Config mirrors Xinyuan-LilyGO/T-Display-S3's own platformio.ini exactly —
; that combination is confirmed working on this exact board.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DCORE_DEBUG_LEVEL=1
